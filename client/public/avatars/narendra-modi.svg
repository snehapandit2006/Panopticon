<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-modi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <linearGradient id="jacket-modi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-modi)" stroke="#e18a37" stroke-width="4" />
  
  <!-- Shoulders / Clothes -->
  <path d="M 30 185 Q 100 135 170 185 L 175 200 L 25 200 Z" fill="url(#jacket-modi)" />
  <path d="M 75 145 L 100 185 L 125 145 Z" fill="#ffffff" />
  <path d="M 88 150 L 100 185 L 112 150 Z" fill="#f8fafc" />

  <!-- Neck -->
  <rect x="85" y="115" width="30" height="30" fill="#f5d0a9" rx="4" />

  <!-- Head -->
  <ellipse cx="100" cy="85" rx="40" ry="46" fill="#f7d4b2" />

  <!-- Ears -->
  <circle cx="58" cy="85" r="9" fill="#f5d0a9" />
  <circle cx="142" cy="85" r="9" fill="#f5d0a9" />

  <!-- Hair (White side hair) -->
  <path d="M 58 75 C 55 50 75 42 100 42 C 125 42 145 50 142 75 C 138 52 122 46 100 46 C 78 46 62 52 58 75 Z" fill="#f1f5f9" />
  <path d="M 57 70 Q 52 85 58 100 Q 64 88 62 70 Z" fill="#e2e8f0" />
  <path d="M 143 70 Q 148 85 142 100 Q 136 88 138 70 Z" fill="#e2e8f0" />

  <!-- White Beard & Mustache -->
  <path d="M 60 82 C 60 130 140 130 140 82 C 140 115 130 135 100 135 C 70 135 60 115 60 82 Z" fill="#ffffff" />
  <path d="M 72 98 Q 100 112 128 98 Q 115 118 100 118 Q 85 118 72 98 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

  <!-- Eyes & Eyebrows -->
  <path d="M 75 70 Q 85 66 92 71" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <path d="M 108 71 Q 115 66 125 70" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  
  <circle cx="84" cy="77" r="3.5" fill="#334155" />
  <circle cx="116" cy="77" r="3.5" fill="#334155" />

  <!-- Nose -->
  <path d="M 97 75 L 95 90 L 103 90" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Mouth -->
  <path d="M 90 106 Q 100 112 110 106" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <!-- Glasses -->
  <rect x="70" y="70" width="25" height="16" rx="4" fill="none" stroke="#475569" stroke-width="3" />
  <rect x="105" y="70" width="25" height="16" rx="4" fill="none" stroke="#475569" stroke-width="3" />
  <line x1="95" y1="76" x2="105" y2="76" stroke="#475569" stroke-width="3" />
  <line x1="58" y1="76" x2="70" y2="76" stroke="#475569" stroke-width="2.5" />
  <line x1="130" y1="76" x2="142" y2="76" stroke="#475569" stroke-width="2.5" />
</svg>
