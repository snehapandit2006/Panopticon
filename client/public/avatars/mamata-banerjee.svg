<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mamata" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="saree-mamata" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-mamata)" stroke="#7a9ac8" stroke-width="4" />
  
  <!-- Shoulders / Saree -->
  <path d="M 25 185 Q 100 135 175 185 L 180 200 L 20 200 Z" fill="url(#saree-mamata)" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Saree Pallu border -->
  <path d="M 45 180 L 140 135 L 165 185 Z" fill="#0284c7" opacity="0.85" />

  <!-- Neck -->
  <rect x="86" y="115" width="28" height="28" fill="#f5cba7" rx="4" />

  <!-- Head -->
  <ellipse cx="100" cy="84" rx="37" ry="43" fill="#f8d7da" />

  <!-- Ears -->
  <circle cx="61" cy="84" r="7.5" fill="#f5cba7" />
  <circle cx="139" cy="84" r="7.5" fill="#f5cba7" />

  <!-- Hair (Saree drape over head / short hair with white streak) -->
  <path d="M 60 82 C 55 45 75 35 100 35 C 125 35 145 45 140 82 C 132 46 120 40 100 40 C 80 40 68 46 60 82 Z" fill="#1e293b" />
  <!-- White streak -->
  <path d="M 72 48 Q 85 40 100 41 Q 85 44 72 58 Z" fill="#f1f5f9" />

  <!-- Eyebrows -->
  <path d="M 72 68 Q 82 63 90 68" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <path d="M 110 68 Q 118 63 128 68" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  
  <!-- Eyes -->
  <circle cx="81" cy="76" r="3.8" fill="#0f172a" />
  <circle cx="119" cy="76" r="3.8" fill="#0f172a" />
  <circle cx="82.5" cy="74.5" r="1.2" fill="#ffffff" />
  <circle cx="120.5" cy="74.5" r="1.2" fill="#ffffff" />

  <!-- Nose -->
  <path d="M 98 74 L 95 89 L 103 89" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Expression / Mouth -->
  <path d="M 88 105 Q 100 110 112 105" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" />
</svg>
